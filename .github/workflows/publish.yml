name: Publish Package

on:
  push:
    branches:
      - main  # Trigger on every push to main
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          token: ${{ secrets.HADOKU_SITE_TOKEN }}

      - uses: WolffM/hadoku-actions/setup-pnpm@v1
        with:
          npm-token: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Configure npm for GitHub Packages
        run: |
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > ~/.npmrc
          echo "@wolffm:registry=https://npm.pkg.github.com" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Install dependencies
        run: pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Build package
        run: pnpm run build

      - name: Check if package changed
        id: package_changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(src/|api/|package\.json)'; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✓ Package has changes"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✗ No changes in package"
          fi

      - name: Check and bump version if needed
        id: version_bump
        if: steps.package_changed.outputs.changed == 'true'
        run: |
          # Get package name and current version from package.json
          package_name=$(node -p "require('./package.json').name")
          current_version=$(node -p "require('./package.json').version")
          echo "Current version: $current_version"
          
          # Start the walk from the registry's latest, not package.json: CI
          # bumps are published but never committed back, so the committed
          # version only falls behind — and this walk used to replay the whole
          # gap one version at a time on every publish (tenhands died at
          # attempt 99 of exactly that on 2026-08-05). From latest, one step.
          latest_published=$(pnpm view "${package_name}" version 2>/dev/null || echo "")
          if [ -n "$latest_published" ]; then
            new_version=$(printf '%s\n%s\n' "$current_version" "$latest_published" | sort -V | tail -1)
            echo "Registry latest: $latest_published; starting walk at $new_version"
          else
            echo "No published version found; starting from package.json"
            new_version="$current_version"
          fi

          # Parse the walk's starting version
          major=$(echo $new_version | cut -d. -f1)
          minor=$(echo $new_version | cut -d. -f2)
          patch=$(echo $new_version | cut -d. -f3)
          
          # Keep bumping until we find an unpublished version
          max_attempts=10
          attempt=0
          
          while pnpm view "${package_name}@${new_version}" version 2>/dev/null && [ $attempt -lt $max_attempts ]; do
            echo "⚠️  Version $new_version already published, bumping..."
            
            # Rollover at .20 to keep patch numbers manageable (matching pre-commit hook)
            if [ $patch -ge 20 ]; then
              minor=$((minor + 1))
              patch=0
              echo "🚀 Rolling over to minor version"
            else
              patch=$((patch + 1))
              echo "📈 Incrementing patch version"
            fi
            
            new_version="$major.$minor.$patch"
            attempt=$((attempt + 1))
          done
          
          if [ $attempt -ge $max_attempts ]; then
            echo "❌ Error: Could not find available version after $max_attempts attempts"
            exit 1
          fi
          
          # Update package.json with new version if it changed
          if [ "$new_version" != "$current_version" ]; then
            node -e "const fs = require('fs'); const p = 'package.json'; const src = fs.readFileSync(p, 'utf8'); const next = src.replace(/(\"version\"\s*:\s*\")[^\"]*(\")/, (m, a, b) => a + process.argv[1] + b); if (next === src) { console.error('could not patch version in ' + p); process.exit(1); } fs.writeFileSync(p, next);" "$new_version"

            echo "✅ Version bumped: $current_version → $new_version"
            echo "bumped=true" >> $GITHUB_OUTPUT

            # Update lock file
            pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --lockfile-only
          else
            echo "✓ Version $current_version is not published yet"
            echo "bumped=false" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Publish package
        if: steps.package_changed.outputs.changed == 'true'
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push version bump back to repo
        if: steps.version_bump.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          # --no-verify: this is a bot commit of a version number the job has
          # already decided, and the pre-commit hook is wrong for it twice over.
          # It runs `pnpm run typecheck`, whose dep-status check reinstalls
          # node_modules — and this is the one npm-touching step with no
          # NODE_AUTH_TOKEN, so fetching a cross-repo @wolffm/* tarball 401s.
          # It also re-bumps the version, because it bumps whenever
          # package.json is staged, which is exactly what this commit stages.
          git commit --no-verify -m "chore: sync version to $(node -p "require('./package.json').version") [skip ci]"
          git push

      # Notify parent app to update dependencies
      - name: Notify parent about package update
        if: steps.package_changed.outputs.changed == 'true'
        env:
          HADOKU_SITE_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}
        run: |
          echo "Notifying hadoku_site about package update..."

          if [ -z "$HADOKU_SITE_TOKEN" ]; then
            echo "⚠️  Warning: HADOKU_SITE_TOKEN not available, skipping notification"
            exit 0
          fi

          payload=$(cat <<EOF
            {
              "event_type": "packages_updated",
              "client_payload": {
                "packages": ["@wolffm/hadoku-aggregator"],
                "sha": "${{ github.sha }}",
                "ref": "${{ github.ref }}"
              }
            }
          EOF
          )

          status_code=$(curl -sS \
            -o /dev/null \
            -w "%{http_code}" \
            -X POST "https://api.github.com/repos/WolffM/hadoku_site/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $HADOKU_SITE_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload")

          if [ "$status_code" = "204" ]; then
            echo "✅ Notified hadoku_site about package update"
          else
            echo "⚠️  Failed to notify hadoku_site (HTTP $status_code)"
          fi
